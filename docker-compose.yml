services:
  postgres:
    image: postgres:15-alpine
    container_name: cats_postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: db
    ports:
      - '25432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U user -d db']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cats_redis
    ports:
      - '26379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  api-service:
    build:
      context: ./backend/api-service
      dockerfile: Dockerfile
    container_name: cats_api_service
    environment:
      NODE_ENV: production
      PORT: 23001
      DATABASE_URL: postgres://user:pass@postgres:5432/db
      REDIS_URL: redis://redis:6379
      JWT_SECRET: supersecretjwtkey
      JWT_EXPIRES_IN: 1d
      FRONTEND_URL: http://localhost:3000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 25432
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: db
      REDIS_HOST: redis
      REDIS_PORT: 26379
      SWAGGER_USER: admin
      SWAGGER_PASS: password
    ports:
      - '23001:23001'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data: